<!doctype html>
<meta charset="utf-8">
<style>
  body { width: 340px; margin: 0; padding: 12px; background: #0d1117; color: #c9d1d9; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  h1 { margin: 0 0 8px; font-size: 13px; color: #7ee787; }
  button { font: inherit; color: #c9d1d9; background: #161b22; border: 1px solid #30363d; border-radius: 4px; padding: 3px 8px; cursor: pointer; }
  button:hover { border-color: #7ee787; }
  #arm { width: 100%; padding: 6px; }
  #arm.on { color: #fff; background: #b62324; border-color: #b62324; }
  label { display: block; margin: 6px 0; color: #8b949e; }
  ul { list-style: none; margin: 8px 0; padding: 0; }
  li { display: grid; grid-template-columns: 1fr auto auto auto; gap: 6px; align-items: center; padding: 5px 0; border-top: 1px solid #21262d; }
  li .name { grid-column: 1 / -1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .meta { color: #8b949e; }
  li .meta { grid-column: 1; }
  .empty { color: #8b949e; border: 0; }
  #msg { min-height: 16px; color: #f0883e; }
  .hint { color: #8b949e; font-size: 11px; }
  .row { display: flex; justify-content: space-between; align-items: center; }
</style>
<h1>stash</h1>
<button id="arm">Catch next download</button>
<label><input type="checkbox" id="sticky"> keep catching (don't disarm after one)</label>
<ul id="list"></ul>
<div id="msg"></div>
<div class="row">
  <span class="hint">click the target spot on the page first, then Drop</span>
  <button id="clear">Clear all</button>
</div>
<script src="popup.js"></script>
